name: Publish Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'
      build_number:
        description: 'Build number'
        required: true
        default: '1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish release
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Determine version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.release_version }}"
            BUILD="${{ inputs.build_number }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v?(.*)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            BUILD="1"
          else
            VERSION="0.1.0"
            BUILD="1"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"

      - name: Check tracked files for whitespace errors
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

      - name: Run XCTest suite
        run: >-
          xcodebuild
          -project MyMacX.xcodeproj
          -scheme MyMacX
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          test

      - name: Build application
        run: |
          RELEASE_VERSION="${{ steps.vars.outputs.version }}" \
          BUILD_NUMBER="${{ steps.vars.outputs.build }}" \
          SIGNING_MODE=adhoc \
          ./scripts/release/build-app.sh

      - name: Package artifacts
        run: |
          RELEASE_VERSION="${{ steps.vars.outputs.version }}" \
          ./scripts/release/package-artifacts.sh

      - name: Verify artifacts
        run: |
          RELEASE_VERSION="${{ steps.vars.outputs.version }}" \
          ./scripts/release/verify-artifacts.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          TAG="v${VERSION}"
          OUTPUT_DIR="build/release/${VERSION}"
          NOTES_FILE="docs/release/release-notes-0.1.0.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="docs/release/release-notes-0.1.0-beta.md"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$OUTPUT_DIR/MyMacX-${VERSION}.dmg" \
              "$OUTPUT_DIR/MyMacX-${VERSION}.zip" \
              "$OUTPUT_DIR/MyMacX-${VERSION}.sha256" \
              --clobber
          else
            gh release create "$TAG" \
              "$OUTPUT_DIR/MyMacX-${VERSION}.dmg" \
              "$OUTPUT_DIR/MyMacX-${VERSION}.zip" \
              "$OUTPUT_DIR/MyMacX-${VERSION}.sha256" \
              --title "My Mac X ${VERSION}" \
              --notes-file "$NOTES_FILE"
          fi
